<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ページが見つかりません｜小林由幸のホームページ</title>
<meta name="robots" content="noindex">
<style>
:root { --bg: #dcefff; --paper: #ffffff; --ink: #000000; --sub: #4a4a4a; --link: #0000ee; --pink: #d6006f; --frame: #8fa3bf; }
@media (prefers-color-scheme: dark) { :root { --bg: #05051a; --paper: #0d0d33; --ink: #f2f2ff; --sub: #c4c4e6; --link: #66ccff; --pink: #ff6ec7; --frame: #5a5aa8; color-scheme: dark; } }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: "MS PGothic", "ＭＳ Ｐゴシック", "Hiragino Kaku Gothic ProN", "Meiryo", sans-serif; line-height: 1.8; }
.box { max-width: 560px; margin: 48px auto; padding: 20px 24px; background: var(--paper); border: 3px ridge var(--frame); text-align: center; }
h1 { color: var(--pink); font-size: 30px; margin: 0 0 12px; }
a { color: var(--link); }
.small { font-size: 13px; color: var(--sub); }
@media (max-width: 600px) { .box { margin: 24px 16px; } }
</style>
</head>
<body>
<div class="box">
<h1>404 Not Found</h1>
<p>お探しのページは見つかりませんでした。</p>
<p>URLが変わったか、まだ工事中のページかもしれません。</p>
<p class="small">研究の世界では、見つからないことも立派な結果です。</p>
<p><a href="/">小林由幸のホームページ TOPへ</a></p>
</div>
</body>
</html>
